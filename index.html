<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Major Key Signature Construction</title>
<style>
  :root {
    --bg: #f7f7f7;
    --panel: #ffffff;
    --text: #111111;
    --muted: #555555;
    --border: #777777;
    --focus: #005fcc;
    --correct: #176b2c;
    --incorrect: #a31621;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 20px;
    line-height: 1.45;
  }
  main {
    max-width: 850px;
    margin: 0 auto;
    padding: 32px 24px 48px;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 20px;
  }
  .panel {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-top: 20px;
  }
  .status {
    min-height: 2em;
    font-weight: 700;
    margin: 14px 0;
  }
  .status.correct { color: var(--correct); }
  .status.incorrect { color: var(--incorrect); }
  .prompt {
    font-size: 1.45rem;
    font-weight: 700;
    margin: 12px 0 22px;
  }
  label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
  }
  input[type="text"] {
    width: 100%;
    max-width: 650px;
    font-size: 1.35rem;
    padding: 14px 16px;
    border: 2px solid #555;
    border-radius: 8px;
    color: #111;
    background: white;
  }
  input[type="text"]:focus {
    outline: 4px solid rgba(0, 95, 204, 0.3);
    border-color: var(--focus);
  }
  button {
    font-size: 1.15rem;
    padding: 12px 20px;
    margin-top: 14px;
    border: 2px solid #444;
    border-radius: 8px;
    background: #eee;
    color: #111;
    cursor: pointer;
  }
  button:focus {
    outline: 4px solid rgba(0, 95, 204, 0.35);
  }
  .controls {
    display: flex;
    gap: 22px;
    align-items: center;
    flex-wrap: wrap;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
  }
  .checkbox-row input {
    width: 24px;
    height: 24px;
  }
  .hint {
    color: var(--muted);
    font-size: 1rem;
    margin-top: 10px;
  }
  .progress {
    font-size: 1rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
  #step2 { display: none; }
  #startArea { display: block; }
</style>
</head>
<body>
<main>
  <h1>Major Key Signature Construction</h1>

  <div class="panel">
    <div class="controls">
      <label class="checkbox-row" for="voiceover">
        <input type="checkbox" id="voiceover" checked>
        Voiceover
      </label>
      <button id="startBtn" type="button">Start</button>
    </div>

    <div id="startArea">
      <p class="hint">Press Enter to hear the prompt. Then type your answer and press Enter.</p>
    </div>

    <div id="gameArea" hidden>
      <div class="progress" id="progress"></div>
      <div class="prompt" id="prompt"></div>

      <div id="step1">
        <label for="answer1">Your answer</label>
        <input id="answer1" type="text" autocomplete="off" spellcheck="false"
               aria-describedby="feedback">
      </div>

      <div id="step2">
        <label for="answer2">Your answer</label>
        <input id="answer2" type="text" autocomplete="off" spellcheck="false"
               spellcheck="false" aria-describedby="feedback">
        <div class="hint">
          Enter one accidental at a time, pressing Enter after each, or enter all of them separated by spaces.
        </div>
      </div>

      <div id="feedback" class="status" role="status" aria-live="assertive"></div>
    </div>
  </div>
</main>

<script>
(() => {
  const keys = [
    {name:"G",  type:"sharp", count:1, accidentals:["F#"]},
    {name:"D",  type:"sharp", count:2, accidentals:["F#","C#"]},
    {name:"A",  type:"sharp", count:3, accidentals:["F#","C#","G#"]},
    {name:"E",  type:"sharp", count:4, accidentals:["F#","C#","G#","D#"]},
    {name:"B",  type:"sharp", count:5, accidentals:["F#","C#","G#","D#","A#"]},
    {name:"F-sharp", type:"sharp", count:6, accidentals:["F#","C#","G#","D#","A#","E#"]},
    {name:"C-sharp", type:"sharp", count:7, accidentals:["F#","C#","G#","D#","A#","E#","B#"]},
    {name:"F",  type:"flat", count:1, accidentals:["Bb"]},
    {name:"B-flat", type:"flat", count:2, accidentals:["Bb","Eb"]},
    {name:"E-flat", type:"flat", count:3, accidentals:["Bb","Eb","Ab"]},
    {name:"A-flat", type:"flat", count:4, accidentals:["Bb","Eb","Ab","Db"]},
    {name:"D-flat", type:"flat", count:5, accidentals:["Bb","Eb","Ab","Db","Gb"]},
    {name:"G-flat", type:"flat", count:6, accidentals:["Bb","Eb","Ab","Db","Gb","Cb"]},
    {name:"C-flat", type:"flat", count:7, accidentals:["Bb","Eb","Ab","Db","Gb","Cb","Fb"]}
  ];

  let current = null;
  let step = 0;
  let completed = new Set();
  let started = false;
  let awaitingPrompt = false;

  const voiceover = document.getElementById("voiceover");
  const startBtn = document.getElementById("startBtn");
  const startArea = document.getElementById("startArea");
  const gameArea = document.getElementById("gameArea");
  const promptEl = document.getElementById("prompt");
  const progressEl = document.getElementById("progress");
  const feedbackEl = document.getElementById("feedback");
  const step1El = document.getElementById("step1");
  const step2El = document.getElementById("step2");
  const answer1 = document.getElementById("answer1");
  const answer2 = document.getElementById("answer2");

  function speak(text, onEnd = null) {
    if (!voiceover.checked || !("speechSynthesis" in window)) {
      if (onEnd) onEnd();
      return;
    }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    u.pitch = 1;
    if (onEnd) u.onend = onEnd;
    window.speechSynthesis.speak(u);
  }

  function tone(freq, duration, type="sine", volume=0.14) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  }

  function ding() {
    tone(880, 0.13, "sine", 0.16);
    setTimeout(() => tone(1320, 0.16, "sine", 0.13), 75);
  }

  function buzzer() {
    tone(150, 0.22, "sawtooth", 0.12);
    setTimeout(() => tone(110, 0.25, "sawtooth", 0.10), 80);
  }

  function formatKeyName(name) {
    return name.replace("sharp", "sharp").replace("flat", "flat");
  }

  function promptText1() {
    return `How many sharps or flats in ${current.name} major?`;
  }

  function expectedCountAnswer() {
    if (current.type === "none") return {count:0, type:"none"};
    return {count:current.count, type:current.type};
  }

  function normalizeCountAnswer(text) {
    const s = text.trim().toLowerCase()
      .replace(/-/g, " ")
      .replace(/\s+/g, " ");
    if (current.type === "none") {
      return /^(0|zero)(?:\s+(?:sharps?|flats?))?$/.test(s);
    }
    const countWords = ["zero","one","two","three","four","five","six","seven"];
    let count = null;
    const m = s.match(/\d+/);
    if (m) count = Number(m[0]);
    else {
      const idx = countWords.indexOf(s.split(" ")[0]);
      if (idx >= 0) count = idx;
    }
    if (count !== current.count) return false;
    const expectedWord = current.type + (current.count === 1 ? "" : "s");
    return s.includes(current.type);
  }

  function accidentalFromText(raw) {
    let s = raw.trim().toLowerCase();
    s = s.replace(/[,\u3001;]+/g, " ");
    s = s.replace(/\s+/g, " ");
    s = s.replace(/-/g, " ");

    const parts = s.split(" ").filter(Boolean);
    if (parts.length === 0) return null;

    const results = [];
    let i = 0;
    while (i < parts.length) {
      const note = parts[i][0];
      if (!"abcdefg".includes(note)) return null;
      let accidental = "";
      if (parts[i].length > 1) {
        const rest = parts[i].slice(1);
        if (rest === "#" || rest === "sharp") accidental = "#";
        else if (rest === "b" || rest === "flat") accidental = "b";
        else return null;
        i++;
      } else if (i + 1 < parts.length &&
                 (parts[i+1] === "#" || parts[i+1] === "sharp" ||
                  parts[i+1] === "b" || parts[i+1] === "flat")) {
        accidental = parts[i+1] === "#" || parts[i+1] === "sharp" ? "#" : "b";
        i += 2;
      } else {
        return null;
      }
      results.push((note + accidental).toUpperCase());
    }
    return results;
  }

  function setFeedback(text, kind="") {
    feedbackEl.textContent = text;
    feedbackEl.className = "status" + (kind ? " " + kind : "");
  }

  function announcePrompt() {
    awaitingPrompt = false;
    promptEl.textContent = step === 1 ? promptText1() : `What are the ${current.type}s in ${current.name} major?`;
    if (step === 1) {
      speak(promptText1());
      answer1.focus();
    } else {
      speak(`What are the ${current.type}s in ${current.name} major?`);
      answer2.focus();
    }
  }

  function chooseKey() {
    const available = keys.filter((_, i) => !completed.has(i));
    if (available.length === 0) {
      completed.clear();
    }
    const pool = keys.filter((_, i) => !completed.has(i));
    const idx = Math.floor(Math.random() * pool.length);
    current = pool[idx];
    const originalIndex = keys.indexOf(current);
    completed.add(originalIndex);
    step = 1;
    started = true;
    gameArea.hidden = false;
    startArea.style.display = "none";
    step1El.style.display = "block";
    step2El.style.display = "none";
    answer1.value = "";
    answer2.value = "";
    setFeedback("");
    progressEl.textContent = "Step 1 of 2";
    promptEl.textContent = "Press Enter to hear the prompt.";
    awaitingPrompt = true;
    answer1.focus();
  }

  function startOrPrompt() {
    if (!started) {
      chooseKey();
      return;
    }
    if (awaitingPrompt) {
      announcePrompt();
    }
  }

  function finishStep1() {
    const correct = normalizeCountAnswer(answer1.value);
    if (!correct) {
      setFeedback("Incorrect.", "incorrect");
      speak("Incorrect.");
      buzzer();
      answer1.select();
      return;
    }

    setFeedback("Correct.", "correct");
    speak("Correct.");
    step = 2;
    step1El.style.display = "none";
    step2El.style.display = "block";
    progressEl.textContent = "Step 2 of 2";
    answer2.value = "";
    setTimeout(() => {
      promptEl.textContent = `What are the ${current.type}s in ${current.name} major?`;
      speak(`What are the ${current.type}s in ${current.name} major?`);
      answer2.focus();
    }, 450);
  }

  function finishRound() {
    setFeedback("Key signature complete.", "correct");
    speak("Key signature complete.", () => {
      chooseKey();
      announcePrompt();
    });
  }

  function processStep2(raw) {
    const parsed = accidentalFromText(raw);
    if (!parsed) {
      setFeedback("Incorrect.", "incorrect");
      speak("Incorrect.");
      buzzer();
      answer2.select();
      return;
    }

    // Multiple parsed accidentals = all-at-once mode.
    if (parsed.length > 1) {
      const expected = current.accidentals.map(a => a.toUpperCase()).sort();
      const actual = parsed.slice().sort();
      const correct = expected.length === actual.length &&
                      expected.every((x, i) => x === actual[i]);

      if (correct) finishRound();
      else {
        setFeedback("Incorrect.", "incorrect");
        speak("Incorrect.");
        buzzer();
        answer2.select();
      }
      return;
    }

    // Single accidental = individual-entry mode.
    const entered = parsed[0];
    const remaining = current.accidentals.map(a => a.toUpperCase()).filter(a => !answer2.dataset.entered?.split("|").includes(a));

    if (!remaining.includes(entered)) {
      setFeedback("Incorrect.", "incorrect");
      speak("Incorrect.");
      buzzer();
      answer2.select();
      return;
    }

    const enteredSoFar = answer2.dataset.entered ? answer2.dataset.entered.split("|").filter(Boolean) : [];
    enteredSoFar.push(entered);
    answer2.dataset.entered = enteredSoFar.join("|");

    ding();
    setFeedback("Correct.", "correct");
    speak("Correct.");

    if (enteredSoFar.length === current.accidentals.length) {
      setTimeout(finishRound, 500);
    } else {
      answer2.value = "";
      setTimeout(() => {
        answer2.focus();
      }, 50);
    }
  }

  answer1.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      if (awaitingPrompt) announcePrompt();
      else finishStep1();
    }
  });

  answer2.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      processStep2(answer2.value);
    }
  });

  startBtn.addEventListener("click", () => {
    if (!started) {
      chooseKey();
      announcePrompt();
    } else {
      announcePrompt();
    }
  });

  // Global Enter: the first Enter starts/hears the prompt.
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const tag = document.activeElement?.tagName;
    if (tag === "INPUT" || tag === "BUTTON") return;
    if (!started) {
      e.preventDefault();
      chooseKey();
      announcePrompt();
    }
  });

  voiceover.addEventListener("change", () => {
    if (!voiceover.checked && "speechSynthesis" in window) {
      speechSynthesis.cancel();
    }
  });
})();
</script>
</body>
</html>
